/*
 * ChatNet standard configuration -- the part that must be IDENTICAL on every server.
 *
 * Put this file next to ircd.conf and include it from there, once, before the auth{} blocks:
 *
 *     .include "/path/to/your/etc-live/chatnet-common.conf"
 *
 * Servers that serve users also include chatnet-clients.conf, servers with a web gateway also include
 * chatnet-webirc.conf. Everything that is local to a server (name, SID, ports, certificates, connect{} blocks,
 * operator{} blocks, classes, auth{} blocks) stays in that server's own ircd.conf.
 *
 * tools/chatnet-audit.py compares a server's configuration with this standard and prints only the differences.
 * Change the standard here, in git, and every server picks it up with a pull and a REHASH.
 *
 * Maintained by abcX (abcx@chatnet.gg) and bitmaster (bitmaster@chatnet.gg), and tested on live leaves by w0od, TGS
 * and Astro. Every change is checked against the configs the production servers run before it ships.
 *
 * Thanks and credits to all the ChatNet admins and operators, and to everyone who has worked on the ChatNet ircd over
 * the years.
 */

/* modules every server loads */
loadmodule "extensions/chm_operonly";
loadmodule "extensions/cn_ip_cloak";
loadmodule "extensions/cn_whois_notify";
loadmodule "extensions/extb_account";
loadmodule "extensions/sno_globaloper";
loadmodule "extensions/cn_clone_except";   /* per-host connection limit exceptions from services */
loadmodule "extensions/cn_uplink";         /* preferred uplink / failover / failback; idle without an uplink.plan */

/* privilege sets: the O:lines of every server refer to these names */
privset "abuse-bot" {
	privs = oper:general, oper:kill, oper:kline, oper:unkline, oper:remoteban, usermode:servnotice, auspex:hostname;
};
privset "admin" {
	privs = oper:general, oper:privs, oper:testline, oper:kill, oper:operwall, oper:message, usermode:servnotice, auspex:oper, auspex:hostname, auspex:umodes, auspex:cmodes, oper:routing, oper:kline, oper:unkline, oper:xline, oper:resv, oper:cmodes, oper:mass_notice, oper:wallops, oper:remoteban, oper:admin, oper:die, oper:rehash, oper:spy, oper:grant;
};
privset "bopm" {
	privs = oper:general, oper:kill, oper:kline, oper:unkline, usermode:servnotice, auspex:oper;
};
privset "cerberus" {
	privs = oper:general, usermode:servnotice;
};
privset "cncheck" {
	privs = oper:general, oper:rehash, oper:wallops;
};
privset "global" {
	privs = oper:general, oper:kill, oper:kline, oper:unkline, oper:xline, oper:resv, usermode:servnotice, oper:testline, oper:operwall, oper:message, auspex:oper, auspex:hostname, auspex:umodes, auspex:cmodes, oper:spy, oper:routing, oper:remoteban, oper:mass_notice, oper:wallops, oper:cmodes;
};
privset "local" {
	privs = oper:general, oper:kill, oper:kline, oper:unkline, oper:xline, oper:resv, usermode:servnotice, oper:testline, oper:operwall, oper:message, auspex:oper, auspex:hostname;
};
privset "realhostbot" {
	privs = oper:general, auspex:hostname;
};

/* network-wide blocks: the same on every server */
service {
	name = "services.chatnet.gg";
};
serverhide {
	flatten_links = yes;
	links_delay = 5 minutes;
	hidden = yes;
	disable_hidden = no;
};
channel {
	use_invex = yes;
	use_except = yes;
	use_forward = yes;
	use_knock = yes;
	knock_delay = 5 minutes;
	knock_delay_channel = 1 minute;
	max_chans_per_user = 15;
	max_bans = 100;
	default_split_user_count = 0;
	default_split_server_count = 0;
	no_create_on_split = no;
	no_join_on_split = no;
	burst_topicwho = yes;
	autochanmodes = "+nt";
};
