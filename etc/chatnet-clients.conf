/* ChatNet standard: modules of every server that serves users (not for a hidden hub). Maintained by abcX (abcx@chatnet.gg) and bitmaster (bitmaster@chatnet.gg). See chatnet-common.conf. */
loadmodule "extensions/cap_sts";
loadmodule "extensions/invite_notify";

/* network-wide settings of every server that serves users */
general {
	hide_error_messages = opers;
	hide_spoof_ips = no;
	default_umodes = "+ix";
	default_operstring = "is an IRC Operator";
	default_adminstring = "is a Server Administrator";
	servicestring = "is a Network Service";
	sasl_service = "SaslServ";
	disable_fake_channels = no;
	tkline_expire_notices = no;
	default_floodcount = 10;
	failed_oper_notice = yes;
	dots_in_ident = 2;
	min_nonwildcard = 4;
	min_nonwildcard_simple = 3;
	max_accept = 100;
	max_monitor = 100;
	anti_nick_flood = yes;
	max_nick_time = 20 seconds;
	max_nick_changes = 5;
	anti_spam_exit_message_time = 5 minutes;
	ts_warn_delta = 30 seconds;
	ts_max_delta = 5 minutes;
	client_exit = yes;
	collision_fnc = yes;
	resv_fnc = yes;
	global_snotices = yes;
	dline_with_reason = yes;
	kline_with_reason = yes;
	kline_reason = "K-Lined";
	identify_service = "DogTag@services.chatnet.gg";
	identify_command = "IDENTIFY";
	non_redundant_klines = yes;
	warn_no_nline = yes;
	use_propagated_bans = yes;
	stats_o_oper_only = yes;
	stats_i_oper_only = masked;
	stats_k_oper_only = masked;
	map_oper_only = yes;
	caller_id_wait = 1 minute;
	pace_wait_simple = 1 second;
	pace_wait = 10 seconds;
	short_motd = no;
	ping_cookie = no;
	connect_timeout = 30 seconds;
	default_ident_timeout = 5;
	disable_auth = no;
	no_oper_flood = yes;
	max_targets = 4;
	client_flood_max_lines = 20;
	oper_only_umodes = operwall, servnotice;
	oper_umodes = servnotice, operwall, wallop;
	oper_snomask = "+s";
	burst_away = yes;
	nick_delay = 0 seconds;
	reject_ban_time = 1 minute;
	reject_after_count = 3;
	reject_duration = 5 minutes;
	throttle_duration = 60;
	throttle_count = 4;
	max_ratelimit_tokens = 30;
	away_interval = 30;
	hide_opers_in_whois = no;
};
dnsbl {
	host = "rbl.efnetrbl.org";
	type = ipv4;
	reject_reason = "Your IP is listed in EFnet's RBL as an open proxy or compromised host. If this is a mistake, see http://efnetrbl.org/ or contact abcx@chatnet.gg.";
};
dnsbl {
	host = "zen.spamhaus.org";
	type = ipv4;
	matches = "2", "3", "4", "5", "6", "7";
	reject_reason = "Your IP is listed in Spamhaus ZEN as a known spam source or compromised host. If this is a mistake, see https://www.spamhaus.org/lookup/ or contact abcx@chatnet.gg.";
};
